name: Student Project CI  # The name of your pipeline

# 1. When should this run?
on:
  push:
    branches: [ "main" ]  # Run when you push to the main branch
  pull_request:
    branches: [ "main" ]  # Run when someone opens a pull request

# 2. What should it do?
jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Use a fresh Linux "Virtual Machine"

    steps:
      # Step 1: Copy your code from GitHub into the VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python on the VM
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install your project's libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run your tests (using pytest)
      - name: Run tests
        run: |
          pip install pytest
          pytest
